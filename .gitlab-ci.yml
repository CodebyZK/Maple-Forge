image: python:3.12-slim

stages:
  - test
  - build

default:
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --cache-dir .cache/pip -e ".[dev]"

test:
  stage: test
  script:
    - pytest

dataset-artifacts:
  stage: build
  script:
    - mkdir -p build
    - >-
      maple-forge-build
      --input tests/fixtures/grants.csv
      --metadata tests/fixtures/grants.metadata.json
      --parquet build/grants.parquet
      --sample build/grants.sample.json
      --rejected build/grants.rejected.jsonl
      --manifest build/grants.manifest.json
      --sample-size 3
      --chunk-size 2
  artifacts:
    paths:
      - build/grants.parquet
      - build/grants.sample.json
      - build/grants.rejected.jsonl
      - build/grants.manifest.json
    expire_in: 30 days
